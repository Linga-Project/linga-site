# Construit le site (python3 build.py, sans dépendance) à chaque push et pull request, et le publie sur GitHub Pages
# depuis main quand Pages est activé pour le dépôt (sinon : construit et vérifié seulement, avec un avertissement).
name: Site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Construction
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    outputs:
      publish: ${{ steps.pages-check.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: GitHub Pages activé ?
        id: pages-check
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" --silent 2>/dev/null; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=GitHub Pages n'est pas activé::Le site est construit et vérifié, mais pas publié. Voir le README, partie « Publication »."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Préparation de GitHub Pages
        id: pages
        if: steps.pages-check.outputs.publish == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Échoue sur un lien interne cassé, une ancre absente, une icône inconnue ou un en-tête de page incomplet.
      # Adresse publique et chemin de base donnés par GitHub Pages : https://linga-project.github.io/linga-site tant que
      # le domaine n'est pas branché, https://linga.chat ensuite. L'adresse sert aux liens canoniques, à Open Graph et
      # au sitemap ; le chemin, à la page 404 (servie à n'importe quelle adresse). Les autres liens sont relatifs.
      # Sans GitHub Pages (pull request, Pages pas activé) : valeurs par défaut de build.py.
      # Tant que HTTPS n'est pas imposé pour un domaine personnalisé, GitHub donne une adresse en http:// : le site
      # sera servi en https:// (certificat fourni par GitHub), c'est cette adresse qui va dans les liens canoniques.
      - name: Construction du site
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -n "$BASE_URL" ]; then
            SITE_URL="${BASE_URL%/}"
            case "$SITE_URL" in http://*) SITE_URL="https://${SITE_URL#http://}" ;; esac
            python3 build.py --site-url "$SITE_URL" --root-path "${BASE_PATH%/}/"
          else
            python3 build.py
          fi

      - name: Envoi du site construit
        if: steps.pages-check.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

  deploy:
    name: Publication
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publication sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
